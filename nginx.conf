# nginx server config for the formatje SPA (copied into the image by the
# Dockerfile). Serves on the unprivileged port 8080.
#
# Note on headers:
# - HSTS is intentionally NOT set here: this container serves plain HTTP and
#   browsers ignore Strict-Transport-Security over HTTP. Set HSTS on the
#   TLS-terminating reverse proxy in front (see SECURITY.md).
# - The CSP allows https://cdn.jsdelivr.net because @monaco-editor/react's
#   default loader fetches the monaco-editor runtime (scripts, styles, fonts)
#   from that CDN at runtime. Do not remove it unless monaco is self-hosted.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Security headers (OWASP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self' https://cdn.jsdelivr.net; worker-src blob:; object-src 'none'; frame-ancestors 'none';" always;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
