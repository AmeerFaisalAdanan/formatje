# Release: build, scan, and publish the container image to GHCR, then
# deploy it to Azure Container Apps.
#
# Every merge to master (and every v* tag) publishes a scanned, versioned
# image to ghcr.io using the GH_TOKS PAT secret (package-write scope).
# The built-in GITHUB_TOKEN can't be used here: this repo's
# default_workflow_permissions is set to read-only, which caps GITHUB_TOKEN
# regardless of the packages: write declared below.
#
# Tags published:
#   latest      - on pushes to master
#   sha-<short> - every build (pin this in docker-compose.yml for rollbacks)
#   semver      - on v* tags (e.g. v1.2.3 -> 1.2.3, 1.2, 1)
#
# The Trivy scan gates the push: the image is built locally first and only
# pushed if no CRITICAL/HIGH vulnerabilities are found.
#
# On pushes to master (not tags), the just-published sha-<short> image is
# then deployed to Azure Container Apps via OIDC federated login (no
# standing Azure secret) — see deploy-azure job below. Auth is scoped by
# an Azure AD federated credential trusting only
# repo:<owner>/<repo>:ref:refs/heads/master, so tag-triggered runs can't
# use it, which is why that job is gated to the master branch.

name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # never cancel a half-finished publish

jobs:
  verify:
    name: Verify (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

  build-publish:
    name: Build, scan & publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN's write:packages grant is capped by the repo's
          # default_workflow_permissions setting (currently read-only), so
          # use the existing PAT that already has package-write instead.
          password: ${{ secrets.GH_TOKS }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # github.repository is lowercased automatically by metadata-action
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: localbuild/formatje:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy) — gates the push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'localbuild/formatje:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Push image to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha

  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: build-publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Container App
        run: |
          az extension add --name containerapp --upgrade --yes -o none

          # ghcr.io image paths must be lowercase; github.repository isn't.
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo_lc}:sha-${GITHUB_SHA:0:7}"
          echo "Deploying $image"

          az containerapp update \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$image"

      - name: Verify deployment health
        run: |
          fqdn=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$fqdn"
          for i in $(seq 1 10); do
            if curl -fsS "https://$fqdn" -o /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after retries"
          exit 1

      - name: Azure logout
        if: always()
        run: az logout
