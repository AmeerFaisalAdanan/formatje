# Secure CI Pipeline
#
# Enforces quality, security, and supply chain integrity for the app.
#
# Triggers: pull requests targeting master only - this is the pre-merge
# gate. It deliberately does NOT also run on push to master: release.yml
# owns that path (its own verify job re-runs lint/test/build, and its
# own Trivy step re-scans the image before publish/deploy), so running
# this workflow again on the same push would just duplicate that work.
# Jobs:
#   1. Quality & Linting (eslint, prettier, vitest, build)
#   2. Containerization & Security (Trivy, CodeQL, Hadolint)
#   3. Semgrep SAST
#   4. Secret Scanning (Gitleaks)
#
# Third-party actions are pinned to full commit SHAs (supply-chain
# hardening); GitHub-owned actions/* and github/* stay on major tags.

name: Secure CI Pipeline

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-linting:
    name: Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

  container-security:
    name: Containerization & Security
    needs: quality-linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # Required for GitHub Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SAST Scan (CodeQL init)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy fs scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build Docker Image
        run: docker build -f Dockerfile -t localbuild/formatje:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'localbuild/formatje:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'  # Fail the build if vulnerabilities are found

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep (OWASP Top Ten)
        run: semgrep scan --config p/owasp-top-ten --sarif --output semgrep.sarif

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep'

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history so gitleaks can scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # Dependabot-triggered runs don't get access to custom repo
          # secrets (GH_TOKS resolves empty there), but GITHUB_TOKEN is
          # always provided regardless of trigger - gitleaks only needs
          # read access to fetch the PR's commit range.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
